name: mowan risk classify
description: >-
  Classify a PR into low / medium / high risk from the base-commit policy and
  the changed/deleted paths and line counts (spec.md section 1). Writes the
  mowan/risk commit status and exposes the tier + reasons as step outputs.

inputs:
  pr-number:
    required: true
  base-sha:
    description: Base commit SHA; the risk policy is read from HERE, never head.
    required: true
  head-sha:
    required: true
  policy-path:
    required: false
    default: .github/risk-policy.json
  github-token:
    required: true

outputs:
  tier:
    description: low | medium | high
    value: ${{ steps.run.outputs.tier }}
  reasons:
    description: JSON array of reasons that fired.
    value: ${{ steps.run.outputs.reasons }}

runs:
  using: composite
  steps:
    - name: Classify and set mowan/risk
      id: run
      shell: bash
      env:
        BASE_SHA: ${{ inputs.base-sha }}
        HEAD_SHA: ${{ inputs.head-sha }}
        POLICY_PATH: ${{ inputs.policy-path }}
        GH_TOKEN: ${{ inputs.github-token }}
        REPO: ${{ github.repository }}
      run: |
        set -euo pipefail
        python3 "$GITHUB_ACTION_PATH/classify.py" "$BASE_SHA" "$HEAD_SHA" "$POLICY_PATH" "$RUNNER_TEMP/risk.json"
        tier=$(jq -r .tier "$RUNNER_TEMP/risk.json")
        reasons=$(jq -c .reasons "$RUNNER_TEMP/risk.json")
        {
          echo "tier=$tier"
          echo "reasons=$reasons"
        } >> "$GITHUB_OUTPUT"
        # mowan/risk is always recomputed (cheap); state of record keyed by head SHA.
        gh api -X POST "repos/$REPO/statuses/$HEAD_SHA" \
          -f state=success \
          -f context=mowan/risk \
          -f description="tier=$tier"
