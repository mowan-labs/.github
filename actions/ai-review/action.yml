name: mowan AI review
description: Send the PR diff to a Bedrock-hosted LLM reviewer, post the verdict as a PR review, and fail unless it approves.

# Credentials: run aws-actions/configure-aws-credentials before this action
# (OIDC role), OR pass bedrock-api-key. With neither, the reviewer fails closed.
inputs:
  model:
    description: Bedrock model or inference-profile ID.
    required: true
  aws-region:
    description: Region for bedrock-runtime.
    required: true
  bedrock-api-key:
    description: Optional Bedrock API key. Leave empty when using an OIDC role.
    required: false
    default: ""
  pr-number:
    required: true
  base-sha:
    required: true
  head-sha:
    required: true
  github-token:
    required: true

runs:
  using: composite
  steps:
    - name: Build diff
      shell: bash
      env:
        BASE_SHA: ${{ inputs.base-sha }}
        HEAD_SHA: ${{ inputs.head-sha }}
      run: git diff "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/diff.patch"

    - name: Install boto3
      shell: bash
      # Exact pin: bumps are a reviewed change here, never a silent upgrade.
      # venv avoids PEP 668 refusals on the runner's system Python.
      run: |
        python3 -m venv "$RUNNER_TEMP/venv"
        "$RUNNER_TEMP/venv/bin/pip" install --quiet --disable-pip-version-check boto3==1.43.108

    - name: Ask the reviewer
      shell: bash
      env:
        REVIEW_MODEL: ${{ inputs.model }}
        AWS_REGION: ${{ inputs.aws-region }}
        AWS_BEARER_TOKEN_BEDROCK: ${{ inputs.bedrock-api-key }}
      run: |
        # An empty bearer variable would shadow OIDC role creds in boto3.
        [ -n "$AWS_BEARER_TOKEN_BEDROCK" ] || unset AWS_BEARER_TOKEN_BEDROCK
        "$RUNNER_TEMP/venv/bin/python" "$GITHUB_ACTION_PATH/ai_review.py" "$RUNNER_TEMP/diff.patch" "$RUNNER_TEMP/verdict.json"

    - name: Post review and set the gate
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        PR: ${{ inputs.pr-number }}
        REPO: ${{ github.repository }}
      run: |
        verdict=$(jq -r .verdict "$RUNNER_TEMP/verdict.json")
        jq -r .body "$RUNNER_TEMP/verdict.json" > "$RUNNER_TEMP/body.md"
        if [ "$verdict" = "APPROVE" ]; then
          gh pr review "$PR" --repo "$REPO" --approve --body-file "$RUNNER_TEMP/body.md"
        else
          gh pr review "$PR" --repo "$REPO" --request-changes --body-file "$RUNNER_TEMP/body.md"
          echo "::error::AI review did not approve"
          exit 1
        fi
