name: mowan AI review
description: Review the PR diff with Kiro CLI in headless mode, post the verdict as a PR review, and fail unless it approves.

# Credential: a Kiro API key (KIRO_API_KEY). Without it the reviewer fails closed.
inputs:
  model:
    description: Optional Kiro model ID. Empty uses Kiro's default model.
    required: false
    default: ""
  kiro-api-key:
    description: Kiro headless API key.
    required: false
    default: ""
  pr-number:
    required: true
  base-sha:
    required: true
  head-sha:
    required: true
  github-token:
    required: true

runs:
  using: composite
  steps:
    - name: Build diff
      shell: bash
      env:
        BASE_SHA: ${{ inputs.base-sha }}
        HEAD_SHA: ${{ inputs.head-sha }}
      run: git diff "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/diff.patch"

    - name: Install Kiro CLI
      shell: bash
      run: |
        curl -fsSL https://cli.kiro.dev/install | bash
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"

    - name: Ask the reviewer
      shell: bash
      env:
        KIRO_API_KEY: ${{ inputs.kiro-api-key }}
        REVIEW_MODEL: ${{ inputs.model }}
        NO_COLOR: "1"
      run: python3 "$GITHUB_ACTION_PATH/ai_review.py" "$RUNNER_TEMP/diff.patch" "$RUNNER_TEMP/verdict.json"

    - name: Post review and set the gate
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        PR: ${{ inputs.pr-number }}
        REPO: ${{ github.repository }}
      run: |
        verdict=$(jq -r .verdict "$RUNNER_TEMP/verdict.json")
        jq -r .body "$RUNNER_TEMP/verdict.json" > "$RUNNER_TEMP/body.md"
        if [ "$verdict" = "APPROVE" ]; then
          gh pr review "$PR" --repo "$REPO" --approve --body-file "$RUNNER_TEMP/body.md"
        else
          gh pr review "$PR" --repo "$REPO" --request-changes --body-file "$RUNNER_TEMP/body.md"
          echo "::error::AI review did not approve"
          exit 1
        fi
