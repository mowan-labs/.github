# Copied into each repo as .github/workflows/ai-review.yml by scripts/onboard-repo.sh.
# All logic lives in mowan-labs/.github; edit there, not here.
name: ai-review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# A called workflow can never exceed the caller's permissions.
permissions:
  contents: write
  pull-requests: write

jobs:
  ai-review:
    uses: mowan-labs/.github/.github/workflows/reusable-ai-review.yml@mainline
    with:
      test-command: __TEST_COMMAND__
    # inherit: the KIRO_API_KEY secret (and any future one) reaches the shared
    # workflow without this file naming them, so adding one needs no caller PR.
    secrets: inherit
