# Reusable AI review + gated self-merge for mowan-labs repos.
#
# Callers keep only templates/caller-ai-review.yml. Everything else lives here,
# so a prompt / model / merge-rule change lands once for every repo.
#
# Merge rule: the PR merges only when BOTH the repo's tests AND the AI review
# pass, and only at the exact head commit that was reviewed.
name: ai-review (reusable)

on:
  workflow_call:
    inputs:
      test-command:
        description: Shell command that runs the repo's tests. Required on purpose; pass `true` to opt out explicitly.
        required: true
        type: string
      auto-merge:
        description: Merge the PR when tests and review both pass.
        required: false
        type: boolean
        default: true
      merge-method:
        description: squash | merge | rebase
        required: false
        type: string
        default: squash
      review-model:
        description: Bedrock model or inference-profile ID. Falls back to the repo variable REVIEW_MODEL.
        required: false
        type: string
        default: ""
    secrets:
      # OIDC mode (preferred): AWS_ROLE_ARN. Not a credential -- only a GitHub
      # OIDC token from a repo the role's trust policy names can assume it --
      # but kept a SECRET so the account ID is masked in public run logs.
      AWS_ROLE_ARN:
        required: false
      # API-key mode: a long-lived Bedrock key. Use only without a role.
      AWS_BEARER_TOKEN_BEDROCK:
        required: false

jobs:
  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: ${{ inputs.test-command }}

  review:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write   # OIDC token for the AWS role; unused in API-key mode
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # `if:` cannot read the secrets context, so expose presence as an output.
      - name: Pick auth mode
        id: auth
        env:
          ROLE: ${{ secrets.AWS_ROLE_ARN }}
        run: if [ -n "$ROLE" ]; then echo "oidc=true" >> "$GITHUB_OUTPUT"; fi
      - name: AWS credentials (OIDC)
        if: ${{ steps.auth.outputs.oidc == 'true' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: ai-review-${{ github.event.pull_request.number }}
          mask-aws-account-id: true
      - uses: mowan-labs/.github/actions/ai-review@mainline
        with:
          model: ${{ inputs.review-model || vars.REVIEW_MODEL }}
          aws-region: ${{ vars.AWS_REGION }}
          bedrock-api-key: ${{ secrets.AWS_BEARER_TOKEN_BEDROCK }}
          pr-number: ${{ github.event.pull_request.number }}
          base-sha: ${{ github.event.pull_request.base.sha }}
          head-sha: ${{ github.event.pull_request.head.sha }}
          github-token: ${{ github.token }}

  merge:
    needs: [tests, review]
    # Kill switch: set repo or org variable AI_AUTOMERGE=false to stop merging
    # everywhere without a PR. Review still runs and still posts its verdict.
    if: ${{ inputs.auto-merge && !github.event.pull_request.draft && vars.AI_AUTOMERGE != 'false' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Merge the reviewed commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          METHOD: ${{ inputs.merge-method }}
        run: |
          case "$METHOD" in squash|merge|rebase) ;; *) echo "bad merge-method: $METHOD"; exit 1;; esac
          # A pull_request run executes the PR's OWN copy of the caller workflow,
          # so a PR touching .github/ could have weakened the gate that is now
          # about to merge it. Those always need a human merge.
          if gh pr diff "$PR" --repo "$REPO" --name-only | grep -q '^\.github/'; then
            echo "::warning::PR changes .github/ -- auto-merge skipped, merge by hand after reading the diff."
            gh pr comment "$PR" --repo "$REPO" --body "Auto-merge skipped: this PR changes \`.github/\`, which controls the review gate itself. A human must merge it."
            exit 0
          fi
          # --match-head-commit refuses if a newer, unreviewed commit was pushed meanwhile.
          gh pr merge "$PR" --repo "$REPO" "--$METHOD" --delete-branch --match-head-commit "$HEAD_SHA"
