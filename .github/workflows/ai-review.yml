# This repo's OWN caller: the shared reviewer reviews changes to itself.
# The reusable workflow is reusable-ai-review.yml; never overwrite it with a caller.
name: ai-review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# A called workflow can never exceed the caller's permissions.
permissions:
  contents: write
  pull-requests: write
  id-token: write   # lets the shared workflow assume the AWS role via OIDC

jobs:
  ai-review:
    uses: mowan-labs/.github/.github/workflows/reusable-ai-review.yml@main
    with:
      test-command: 'python3 -m py_compile actions/ai-review/ai_review.py && bash -n scripts/onboard-repo.sh'
      auto-merge: false   # changes to the shared reviewer are merged by hand
    secrets:
      AWS_BEARER_TOKEN_BEDROCK: ${{ secrets.AWS_BEARER_TOKEN_BEDROCK }}
