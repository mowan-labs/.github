# This repo's OWN caller: the shared reviewer reviews changes to itself.
# The reusable workflow is reusable-ai-review.yml; never overwrite it with a caller.
name: ai-review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# A called workflow can never exceed the caller's permissions.
permissions:
  contents: write
  pull-requests: write

jobs:
  ai-review:
    uses: mowan-labs/.github/.github/workflows/reusable-ai-review.yml@mainline
    with:
      test-command: 'python3 -m unittest discover -s tests && bash -n scripts/onboard-repo.sh'
      auto-merge: false   # changes to the shared reviewer are merged by hand
    # inherit: the KIRO_API_KEY secret (and any future one) reaches the shared
    # workflow without this file naming them, so adding one needs no caller PR.
    secrets: inherit
